name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: ./.forgejo/actions/setup-nix

      - name: Run tests
        run: cargo test

      - name: Build (${{ matrix.target }})
        run: |
          nix build .#${{ matrix.target }} --print-build-logs --accept-flake-config
          ls -lah result/bin/
