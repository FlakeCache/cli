name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GARAGE_ENDPOINT_URL: https://s3-eu1.centralcloud.com
  GARAGE_BUCKET: centralcloud-flakecache
  ARTIFACT: flakecache-linux-x86_64

jobs:
  release:
    name: Build and publish Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: ./.forgejo/actions/setup-nix

      - name: Run tests
        run: cargo test

      - name: Build native artifact
        run: |
          set -euo pipefail
          nix build .#x86_64-linux --print-build-logs --accept-flake-config
          cp result/bin/flakecache "$ARTIFACT"
          chmod +x "$ARTIFACT"
          sha256sum "$ARTIFACT" > checksums.sha256
          cat checksums.sha256

      - name: Clone internal releases repo
        env:
          FLAKECACHE_TOKEN: ${{ secrets.FLAKECACHE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLAKECACHE_TOKEN:-}" ]; then
            echo "FLAKECACHE_TOKEN is required to update flakecache/releases"
            exit 1
          fi
          git clone "https://x-access-token:${FLAKECACHE_TOKEN}@git.infra.centralcloud.com/flakecache/releases.git" releases

      - name: Commit and push to internal releases repo
        run: |
          set -euo pipefail
          mkdir -p releases/cli/dist
          cp "$ARTIFACT" checksums.sha256 releases/cli/dist/
          cd releases
          git config user.name "FlakeCache Bot"
          git config user.email "bot@flakecache.com"
          git add cli/dist/
          git commit -m "Update CLI binaries from FlakeCache/cli ${{ github.ref_name }}" || echo "No changes"
          git push origin main
          git tag -f "cli-${{ github.ref_name }}"
          git push -f origin "cli-${{ github.ref_name }}"

      - name: Upload CLI artifacts to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu1
        run: |
          set -euo pipefail
          nix run nixpkgs#awscli2 -- s3 sync . "s3://${GARAGE_BUCKET}/cli/" \
            --endpoint-url "${GARAGE_ENDPOINT_URL}" \
            --exclude "*" \
            --include "$ARTIFACT" \
            --include "checksums.sha256"
