name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GARAGE_ENDPOINT_URL: https://s3-eu1.centralcloud.com
  GARAGE_BUCKET: centralcloud-flakecache

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: flakecache-linux-x86_64
            linker_package: ""
            linker_env: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: flakecache-linux-aarch64
            linker_package: gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: flakecache-macos-x86_64
            linker_package: ""
            linker_env: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: flakecache-macos-aarch64
            linker_package: ""
            linker_env: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: flakecache-windows-x86_64.exe
            linker_package: ""
            linker_env: ""
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: flakecache-windows-aarch64.exe
            linker_package: ""
            linker_env: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        if: matrix.os != 'windows-latest'
        uses: ./.forgejo/actions/setup-nix

      - name: Install Linux cross linker
        if: matrix.linker_package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y "${{ matrix.linker_package }}"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test

      - name: Verify Nix native build
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: nix build .#x86_64-linux --print-build-logs --accept-flake-config

      - name: Build Unix artifact
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.linker_env }}" ]; then
            export ${{ matrix.linker_env }}
          fi
          cargo build --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/flakecache" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"

      - name: Build Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build --release --target "${{ matrix.target }}"
          Copy-Item "target/${{ matrix.target }}/release/flakecache.exe" "${{ matrix.artifact }}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: cli

      - name: Install Nix
        uses: ./.forgejo/actions/setup-nix

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify expected artifacts and generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          expected=(
            flakecache-linux-x86_64
            flakecache-linux-aarch64
            flakecache-macos-x86_64
            flakecache-macos-aarch64
            flakecache-windows-x86_64.exe
            flakecache-windows-aarch64.exe
          )
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
          done
          sha256sum "${expected[@]}" > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      - uses: actions/checkout@v4
        with:
          repository: flakecache/releases
          token: ${{ secrets.FLAKECACHE_TOKEN }}
          path: releases

      - name: Copy binaries to internal releases repo
        run: |
          set -euo pipefail
          mkdir -p releases/cli/dist
          cp artifacts/flakecache-* releases/cli/dist/
          cp artifacts/checksums.sha256 releases/cli/dist/
          ls -la releases/cli/dist/

      - name: Commit and push to internal releases repo
        run: |
          set -euo pipefail
          cd releases
          git config user.name "FlakeCache Bot"
          git config user.email "bot@flakecache.com"
          git add cli/dist/
          git commit -m "Update CLI binaries from FlakeCache/cli ${{ github.ref_name }}" || echo "No changes"
          git push origin main
          git tag -f "cli-${{ github.ref_name }}"
          git push -f origin "cli-${{ github.ref_name }}"

      - name: Upload CLI artifacts to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu1
        run: |
          set -euo pipefail
          nix run nixpkgs#awscli2 -- s3 sync artifacts/ "s3://${GARAGE_BUCKET}/cli/" \
            --endpoint-url "${GARAGE_ENDPOINT_URL}" \
            --exclude "*" \
            --include "flakecache-*" \
            --include "checksums.sha256"
